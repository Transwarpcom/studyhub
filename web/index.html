<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学习台</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#171a21;--sub:#6b7280;--line:#e6e8ee;--accent:#2f6bff;--ok:#15a34a;--bad:#e03131;--code:#f2f4f8}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--sub:#8b949e;--line:#2a313a;--accent:#5b8cff;--code:#1d242e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
@media(min-width:780px){
  body{padding-bottom:0}
  .tab{position:sticky;top:50px;bottom:auto;border-top:none;border-bottom:1px solid var(--line);max-width:860px;margin:0 auto;border-radius:0 0 12px 12px}
  .tab a{padding:11px 0;font-size:12.5px}
  .tab a i{display:none}
}
.hd{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px;min-height:50px}
.hd h1{font-size:15.5px;margin:0;flex:1;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd button{background:none;border:none;color:var(--accent);font-size:14px;padding:5px 3px;cursor:pointer}
.wrap{padding:14px 14px 24px;max-width:860px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px}
.row{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:560;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--sub);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.badge{font-size:10.5px;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill{font-size:10.5px;padding:1px 7px;border-radius:20px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tab{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tab a{flex:1;text-align:center;padding:12px 0 10px;font-size:12.5px;color:var(--sub);text-decoration:none;font-weight:500}
.tab a.on{color:var(--accent)}
.tab a i{display:block;font-size:19px;font-style:normal;line-height:1.25}
h2{font-size:16.5px;margin:16px 0 9px;font-weight:650}
h3{font-size:15px;margin:13px 0 7px;font-weight:620}
p{margin:8px 0}
ul,ol{margin:8px 0;padding-left:22px}
li{margin:3px 0}
strong{font-weight:640}
code{background:var(--code);padding:1.5px 5px;border-radius:5px;font-size:.88em;font-family:ui-monospace,Menlo,Consolas,monospace}
pre{background:var(--code);padding:11px;border-radius:9px;overflow:auto;margin:9px 0}
pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
th{background:var(--bg);font-weight:600}
blockquote{border-left:3px solid var(--line);margin:9px 0;padding:2px 0 2px 12px;color:var(--sub)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.katex{font-size:1.05em}
.math{display:inline}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:14.5px;color:var(--text);cursor:pointer;transition:border-color .12s,background .12s;line-height:1.6}
.opt:active{transform:scale(.995)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--card))}
.opt[disabled]{cursor:default;opacity:.92}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;margin-bottom:9px;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{background:var(--line);color:var(--sub)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--text)}
.muted{color:var(--sub);font-size:12.5px}
.err{color:var(--bad);font-size:12.5px;margin:5px 0;min-height:17px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(8px);background:#000d;color:#fff;padding:9px 17px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.crumb{font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.7}
.crumb a{color:var(--sub);text-decoration:none}
.stat{display:flex;gap:9px;margin-top:11px}
.stat div{flex:1;background:var(--bg);border-radius:10px;padding:9px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:650;line-height:1.25}
.stat span{font-size:10.5px;color:var(--sub)}
.exp{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--sub)}
.exp .lab{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px}
.skel{height:15px;background:var(--line);border-radius:6px;margin:9px 0;animation:p 1.3s infinite}
@keyframes p{50%{opacity:.4}}
</style>
</head>
<body>
<div class="hd">
  <button id="back" style="display:none" onclick="back()">‹</button>
  <h1 id="title">学习台</h1>
  <button id="authBtn" onclick="location.hash='#/me'">登录</button>
</div>
<main class="wrap" id="app"></main>
<nav class="tab">
  <a href="#/home" data-t="home">今日</a>
  <a href="#/lib" data-t="lib">课程</a>
  <a href="#/wrong" data-t="wrong">错题本</a>
  <a href="#/me" data-t="me">我的</a>
</nav>
<div class="toast" id="toast"></div>
<script src="katex/katex.min.js"></script>
<script>
// ============ 基础 ============
const ROOT = location.origin;
const API = ROOT;                       // /web 只是静态壳，接口都在根上
const store = {
  token: localStorage.getItem('sh.token') || '',
  user: localStorage.getItem('sh.user') || '',
  registerOpen: false,
  progress: load('sh.progress', {}),
  wrongs: load('sh.wrongs', []),
  manifest: null,
  lessons: {},
};
function load(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d }catch(e){ return d } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
function $(s){ return document.querySelector(s) }
function el(h){ const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
let toastTimer;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1700) }

// ============ Markdown + LaTeX ============
// 先把数学片段抽出来占位，避免 Markdown 处理破坏反斜杠
function renderMD(src){
  if(!src) return '';
  const maths = [];
  let s = String(src);
  // $$...$$ 块级
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_,tex)=>{ maths.push({tex, block:true}); return `\u0000M${maths.length-1}\u0000` });
  // $...$ 行内（避开 \$）
  s = s.replace(/(^|[^\\])\$([^$\n]+?)\$/g, (m,p,tex)=>{ maths.push({tex, block:false}); return p+`\u0000M${maths.length-1}\u0000` });

  // 代码块
  const codes = [];
  s = s.replace(/```([\s\S]*?)```/g, (_,c)=>{ codes.push(c.replace(/^\w*\n/,'')); return `\u0000C${codes.length-1}\u0000` });

  s = esc(s);

  // 标题
  s = s.replace(/^######\s+(.+)$/gm,'<h3>$1</h3>')
       .replace(/^#####\s+(.+)$/gm,'<h3>$1</h3>')
       .replace(/^####\s+(.+)$/gm,'<h3>$1</h3>')
       .replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
       .replace(/^##\s+(.+)$/gm,'<h2>$1</h2>')
       .replace(/^#\s+(.+)$/gm,'<h2>$1</h2>');
  // 粗体 / 斜体 / 行内代码
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
       .replace(/`([^`]+)`/g,'<code>$1</code>');
  // 分隔线
  s = s.replace(/^---+$/gm,'<hr>');
  // 引用
  s = s.replace(/^&gt;\s?(.+)$/gm,'<blockquote>$1</blockquote>');
  // 表格
  s = s.replace(/^\|(.+)\|\s*$/gm, (line)=>{
    const cells = line.slice(1,-1).split('|').map(x=>x.trim());
    if(cells.every(c=>/^:?-{2,}:?$/.test(c))) return '\u0000SEP\u0000';
    return '<tr>' + cells.map(c=>`<td>${c}</td>`).join('') + '</tr>';
  });
  // 把连续 tr 包成 table，去掉分隔行
  s = s.replace(/(?:\u0000SEP\u0000\n?)/g,'');
  s = s.replace(/(<tr>[\s\S]*?<\/tr>)(?:\s*\n\s*(<tr>[\s\S]*?<\/tr>))+/g, m=>`<table><tbody>${m.replace(/\n/g,'')}</tbody></table>`);
  s = s.replace(/<table><tbody>(<tr>[\s\S]*?<\/tr>)<\/tbody><\/table>/g,'<table><tbody>$1</tbody></table>');
  // 表格首行当表头
  s = s.replace(/<table><tbody>([\s\S]*?)<\/tbody><\/table>/g,(m,body)=>{
    const rows = body.match(/<tr>[\s\S]*?<\/tr>/g)||[];
    if(!rows.length) return m;
    const head = rows[0].replace(/<td>/g,'<th>').replace(/<\/td>/g,'</th>');
    return `<table><thead>${head}</thead><tbody>${rows.slice(1).join('')}</tbody></table>`;
  });
  // 列表
  s = s.replace(/(?:^(?:[-*+]|\d+\.)\s+.+$\n?)+/gm, (block)=>{
    const items = block.trim().split('\n').map(l=>{
      const m = l.match(/^(?:[-*+]|\d+\.)\s+(.+)$/);
      return m ? `<li>${m[1]}</li>` : '';
    }).join('');
    return `<ul>${items}</ul>`;
  });
  // 段落
  s = s.split(/\n{2,}/).map(p=>{
    const t = p.trim();
    if(!t) return '';
    if(/^<(h\d|ul|ol|table|blockquote|pre|hr|div|p)/.test(t)) return t;
    return `<p>${t.replace(/\n/g,'<br>')}</p>`;
  }).join('\n');

  // 还原代码
  s = s.replace(/\u0000C(\d+)\u0000/g, (_,i)=>`<pre><code>${esc(codes[+i])}</code></pre>`);
  // 还原数学
  s = s.replace(/\u0000M(\d+)\u0000/g, (_,i)=>{
    const m = maths[+i];
    return `<span class="math" data-tex="${esc(m.tex)}" ${m.block?'data-block':''}></span>`;
  });
  return s;
}

function typeset(root){
  if(!window.katex) return;
  root.querySelectorAll('.math[data-tex]').forEach(n=>{
    const tex = n.getAttribute('data-tex');
    try{
      katex.render(tex, n, {throwOnError:false, displayMode:n.hasAttribute('data-block'), strict:false});
      n.removeAttribute('data-tex');
    }catch(e){ n.textContent = tex; }
  });
}

// ============ 接口 ============
async function api(path, opt={}){
  const h = {'Content-Type':'application/json'};
  if(store.token) h['Authorization'] = 'Bearer ' + store.token;
  const r = await fetch(API+path, {...opt, headers:{...h, ...(opt.headers||{})}});
  let d=null; try{ d=await r.json() }catch(e){}
  if(!r.ok) throw new Error((d&&(d.message||d.error))||('HTTP '+r.status));
  return d;
}

// ============ 路由 ============
function route(p){ location.hash = '#'+p }
function back(){ history.length>1?history.back():route('/lib') }
window.addEventListener('hashchange', paint);
window.addEventListener('DOMContentLoaded', boot);

async function boot(){
  await loadManifest();
  await restoreAuth();
  paint();
}

function parseHash(){
  const raw=(location.hash||'#/home').slice(1);
  const [p,q]=raw.split('?');
  return {p, q:new URLSearchParams(q||'')};
}

async function paint(){
  const {p,q}=parseHash();
  const app=$('#app'), backBtn=$('#back'), title=$('#title');
  document.querySelectorAll('.tab a').forEach(a=>{
    const t=a.dataset.t;
    a.classList.toggle('on', p.startsWith('/'+t) || (t==='lib'&&p.startsWith('/lesson')));
  });
  backBtn.style.display = ['/home','/lib','/wrong','/me'].includes(p)?'none':'block';
  $('#authBtn').textContent = store.user || '登录';

  if(p==='/home'){ title.textContent='今日'; return paintHome(app) }
  if(p==='/lib'){ title.textContent='课程'; return paintLib(app, q.get('id')||'') }
  if(p==='/lesson'){ title.textContent=''; return paintLesson(app, q.get('id')||'') }
  if(p==='/wrong'){ title.textContent='错题本'; return paintWrong(app) }
  if(p==='/me'){ title.textContent='我的'; return paintMe(app) }
  route('/home');
}

// ============ 数据 ============
async function loadManifest(){
  const c=load('sh.manifest',null);
  if(c) store.manifest=c;
  try{
    const r=await fetch(API+'/manifest');
    if(r.ok){ store.manifest=await r.json(); save('sh.manifest',store.manifest) }
  }catch(e){}
}
function walk(nodes, fn, parents=[]){
  for(const n of nodes||[]){
    fn(n, parents);
    if(n.children) walk(n.children, fn, [...parents, n]);
  }
}
function findNode(id){
  let hit=null;
  walk(store.manifest?.tree, n=>{ if(n.id===id) hit=n });
  return hit;
}
function flatLessons(){
  const out=[]; walk(store.manifest?.tree, n=>{ if((n.kind||'')==='lesson') out.push(n) });
  return out;
}
async function loadLesson(id){
  if(store.lessons[id]) return store.lessons[id];
  const c=load('sh.lesson.'+id,null);
  if(c) store.lessons[id]=c;
  try{
    const d=await api('/lesson?id='+encodeURIComponent(id));
    store.lessons[id]=d; save('sh.lesson.'+id,d); return d;
  }catch(e){ return store.lessons[id]||null }
}

// ============ 页面 ============
function paintHome(app){
  const total=flatLessons().length;
  const done=Object.values(store.progress).filter(Boolean).length;
  const wrongN=store.wrongs.length;
  app.innerHTML=`
    <div class="card">
      <div class="muted">${store.user?'👤 '+esc(store.user)+' · 进度已同步':'未登录 · 进度只存本机'}</div>
      <h2 style="margin:6px 0 0">继续学习</h2>
      <div class="stat">
        <div><b>${done}</b><span>答对</span></div>
        <div><b>${wrongN}</b><span>错题</span></div>
        <div><b>${total}</b><span>总节数</span></div>
      </div>
    </div>
    <div class="card">
      <div class="row" onclick="location.hash='#/lib'">
        <div class="t"><b>全部课程</b><small>高等数学 A1 · 大学英语</small></div>
        <span class="badge">${total} 节</span>
      </div>
      <div class="row" onclick="location.hash='#/wrong'">
        <div class="t"><b>错题本</b><small>答错自动收录，重做答对移除</small></div>
        <span class="badge">${wrongN}</span>
      </div>
    </div>`;
}

function paintLib(app, id){
  const nodes = id ? (findNode(id)?.children||[]) : (store.manifest?.tree||[]);
  let crumb='';
  if(id){
    const chain=[]; let p=[];
    walk(store.manifest?.tree,(n,parents)=>{ if(n.id===id) p=parents },);
    // 手动找链
    (function find(list,trail){
      for(const n of list||[]){
        if(n.id===id){ chain.push(...trail,n); return true }
        if(n.children && find(n.children,[...trail,n])) return true;
      }
      return false;
    })(store.manifest?.tree||[],[]);
    crumb=`<div class="crumb"><a href="#/lib">课程</a>`+chain.map(n=>` › <a href="#/lib?id=${encodeURIComponent(n.id)}">${esc(n.title)}</a>`).join('')+`</div>`;
  }
  if(!nodes.length){ app.innerHTML=crumb+'<div class="card muted">这一层还没有内容</div>'; return }
  app.innerHTML=crumb+'<div class="card" id="lst"></div>';
  const box=$('#lst');
  nodes.forEach(n=>{
    const isL=(n.kind||'')==='lesson';
    const kids=n.children?.length||0;
    const pct=isL?lessonPct(n.id):0;
    const row=el(`<div class="row">
      <div class="t"><b>${esc(n.title)}</b><small>${esc(n.summary||'')}</small></div>
      ${pct>0?`<span class="pill ok">${pct}%</span>`:''}
      ${n.badge?`<span class="badge">${esc(n.badge)}</span>`:(kids?`<span class="badge">${kids} 节</span>`:'')}
    </div>`);
    row.onclick=()=>{ location.hash = isL ? '#/lesson?id='+encodeURIComponent(n.id)
                                            : '#/lib?id='+encodeURIComponent(n.id) };
    box.appendChild(row);
  });
}

function lessonPct(lid){
  const l=store.lessons[lid]; if(!l||!l.cards) return 0;
  const qs=l.cards.filter(c=>c.type&&c.type!=='lecture');
  if(!qs.length) return 0;
  const done=qs.filter(c=>store.progress[lid+'|'+c.id]!==undefined).length;
  return Math.round(done/qs.length*100);
}

async function paintLesson(app, id){
  const node=findNode(id);
  $('#title').textContent=node?.title||'';
  app.innerHTML='<div class="card"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  const l=await loadLesson(id);
  if(!l){ app.innerHTML='<div class="card muted">加载失败，检查网络</div>'; return }

  const cards=l.cards||[];
  const pieces=[];
  if(l.subtitle) pieces.push(`<div class="muted" style="margin:-4px 0 12px 2px">${esc(l.subtitle)}</div>`);

  cards.forEach((c,idx)=>{
    if(c.type==='lecture'){
      pieces.push(`<div class="card">${renderMD(c.md||'')}</div>`);
      return;
    }
    const key=id+'|'+c.id;
    const st=store.progress[key];
    pieces.push(`<div class="card" data-card="${esc(c.id)}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
        <span class="badge">第 ${idx+1} 张</span>
        ${st===true?'<span class="pill ok">已答对</span>':st===false?'<span class="pill bad">答错过</span>':''}
      </div>
      <div style="margin-bottom:11px">${renderMD(c.question||c.q||'')}</div>
      <div class="opts"></div>
      <div class="exp" style="display:none"></div>
    </div>`);
  });

  app.innerHTML=pieces.join('')||'<div class="card muted">这一节还没有内容</div>';
  typeset(app);

  // 绑定答题
  app.querySelectorAll('[data-card]').forEach(cardEl=>{
    const cid=cardEl.dataset.card;
    const c=cards.find(x=>x.id===cid);
    const box=cardEl.querySelector('.opts');
    if(!c||!box) return;

    if(c.type==='choice' && Array.isArray(c.options)){
      c.options.forEach((optText,i)=>{
        const b=el(`<button class="opt" data-i="${i}"></button>`);
        b.innerHTML=renderMD(optText);
        b.onclick=()=>pick(cardEl,c,id,i);
        box.appendChild(b);
      });
      typeset(box);
      // 已答过的还原
      const st=store.progress[id+'|'+cid];
      const ans=normalizeAnswer(c.answer);
      if(st!==undefined){
        box.querySelectorAll('.opt').forEach(b=>{
          const i=+b.dataset.i;
          b.disabled=true;
          if(ans.includes(i)) b.classList.add('ok');
          else if(st===false && i===c._picked) b.classList.add('bad');
        });
      }
    } else if(c.type==='fill'||c.type==='blank'){
      const inp=el(`<input type="text" placeholder="输入答案">`);
      const btn=el(`<button class="btn" style="margin-top:2px">提交</button>`);
      const st=store.progress[id+'|'+cid];
      if(st!==undefined){ inp.disabled=true; btn.disabled=true; inp.value='' }
      btn.onclick=()=>{
        const ok=checkFill(inp.value,c);
        finish(cardEl,c,id,ok,btn,inp);
      };
      box.appendChild(inp); box.appendChild(btn);
    } else if(c.type==='judge'||c.type==='truefalse'){
      ['正确','错误'].forEach((t,i)=>{
        const b=el(`<button class="opt" data-i="${i}">${t}</button>`);
        b.onclick=()=>pick(cardEl,c,id,i);
        box.appendChild(b);
      });
      const st=store.progress[id+'|'+cid];
      if(st!==undefined) box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    } else {
      // 未知类型：把 answer 当文本给出
      box.innerHTML=`<div class="muted">（此题型暂不支持）</div>`;
    }
  });
}

function normalizeAnswer(a){
  if(a===undefined||a===null) return [];
  if(Array.isArray(a)) return a.map(x=>typeof x==='number'?x:x);
  if(typeof a==='number') return [a];
  return [a];
}

function pick(cardEl, c, lid, i){
  const ans=normalizeAnswer(c.answer);
  const ok=ans.map(String).includes(String(i));
  c._picked=i;
  const box=cardEl.querySelector('.opts');
  box.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const bi=+b.dataset.i;
    if(ans.map(String).includes(String(bi))) b.classList.add('ok');
    else if(bi===i) b.classList.add('bad');
  });
  finish(cardEl,c,lid,ok);
}

function finish(cardEl, c, lid, ok, btn, inp){
  if(btn) btn.disabled=true;
  if(inp) inp.disabled=true;
  const key=lid+'|'+c.id;
  store.progress[key]=ok;
  const wi=store.wrongs.findIndex(w=>w.id===key);
  if(ok){ if(wi>=0) store.wrongs.splice(wi,1) }
  else if(wi<0){
    store.wrongs.unshift({
      id:key, lessonId:lid, lessonTitle:findNode(lid)?.title||lid,
      cardId:c.id, preview:(c.question||c.q||'').replace(/[$*#`]/g,'').slice(0,44), ts:Date.now()
    });
  }
  save('sh.progress',store.progress);
  save('sh.wrongs',store.wrongs);

  const exp=cardEl.querySelector('.exp');
  if(exp && (c.explain||c.exp)){
    exp.style.display='block';
    exp.innerHTML=`<div class="lab">解析</div>`+renderMD(c.explain||c.exp);
    typeset(exp);
  }
  toast(ok?'✓ 答对了':'✗ 答错了，已进错题本');
  if(store.token) queuePush();
  // 刷新标题栏进度
  paintPill(cardEl, ok);
}

function paintPill(cardEl, ok){
  const hdr=cardEl.querySelector('div');
  if(!hdr) return;
  const old=hdr.querySelector('.pill');
  if(old) old.remove();
  const p=document.createElement('span');
  p.className='pill '+(ok?'ok':'bad');
  p.textContent=ok?'已答对':'答错过';
  hdr.appendChild(p);
}

function checkFill(v, c){
  const target=String(Array.isArray(c.answer)?c.answer[0]:c.answer??'').trim();
  const got=String(v||'').trim();
  if(!got) return false;
  if(got===target) return true;
  // 允许忽略空格和大小写
  return got.replace(/\s+/g,'').toLowerCase()===target.replace(/\s+/g,'').toLowerCase();
}

function paintWrong(app){
  if(!store.wrongs.length){
    app.innerHTML='<div class="card muted">还没有错题。选择题、填空题答错会自动进这里，重做答对自动移除。</div>';
    return;
  }
  app.innerHTML='<div class="card" id="wl"></div>';
  const box=$('#wl');
  store.wrongs.forEach(w=>{
    const row=el(`<div class="row">
      <div class="t"><b>${esc(w.preview||w.cardId)}</b><small>${esc(w.lessonTitle||'')}</small></div>
      <span class="badge">重做</span>
    </div>`);
    row.onclick=()=>{ location.hash='#/lesson?id='+encodeURIComponent(w.lessonId) };
    box.appendChild(row);
  });
}

async function paintMe(app){
  if(store.user){
    app.innerHTML=`
      <div class="card">
        <div style="font-size:15.5px;font-weight:600">👤 ${esc(store.user)}</div>
        <div class="muted" style="margin-top:5px">进度、错题、笔记绑定此账号，换设备登录自动同步</div>
        <div class="muted" style="margin-top:2px">服务器 ${esc(location.host)}</div>
      </div>
      <div class="card">
        <button class="btn" id="sync">立即同步</button>
        <div style="height:9px"></div>
        <button class="btn ghost" id="out">退出登录</button>
      </div>
      <div class="card muted">课程与题目对所有人开放，不用登录也能看。登录只用于同步你自己的进度，账号之间互相看不到。</div>`;
    $('#sync').onclick=async()=>{
      const b=$('#sync'); b.disabled=true; b.textContent='同步中…';
      try{ await pushProgress(); toast('已同步') }catch(e){ toast('同步失败：'+e.message) }
      b.disabled=false; b.textContent='立即同步';
    };
    $('#out').onclick=async()=>{
      try{ await api('/auth/logout',{method:'POST',body:'{}'}) }catch(e){}
      store.token=''; store.user='';
      localStorage.removeItem('sh.token'); localStorage.removeItem('sh.user');
      toast('已退出'); route('/home');
    };
    return;
  }
  app.innerHTML=`
    <div class="card">
      <div style="font-weight:600;margin-bottom:11px">登录</div>
      <input type="text" id="u" placeholder="用户名" autocomplete="username" autocapitalize="none">
      <input type="password" id="p" placeholder="密码" autocomplete="current-password">
      <div class="err" id="e"></div>
      <button class="btn" id="lb">登录</button>
      <div style="height:9px"></div>
      <button class="btn ghost" id="rb" ${store.registerOpen?'':'disabled'}>${store.registerOpen?'注册新账号':'注册暂未开放'}</button>
    </div>
    <div class="card muted">课程和题目不用登录也能看。登录后进度、错题才会存进账号，换设备自动同步。</div>`;
  $('#lb').onclick=doLogin;
  $('#p').onkeydown=e=>{ if(e.key==='Enter') doLogin() };
  $('#rb').onclick=doRegister;
}

async function doLogin(){
  const u=$('#u').value.trim(), p=$('#p').value, e=$('#e');
  e.textContent='';
  if(!u||!p){ e.textContent='用户名和密码都要填'; return }
  const b=$('#lb'); b.disabled=true; b.textContent='登录中…';
  try{
    const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
    store.token=d.token; store.user=d.username;
    localStorage.setItem('sh.token',d.token); localStorage.setItem('sh.user',d.username);
    await pullProgress();
    toast('登录成功'); route('/home');
  }catch(err){ e.textContent=err.message }
  b.disabled=false; b.textContent='登录';
}

async function doRegister(){
  const u=$('#u').value.trim(), p=$('#p').value, e=$('#e');
  e.textContent='';
  if(p.length<6){ e.textContent='密码至少 6 位'; return }
  try{
    const d=await api('/auth/register',{method:'POST',body:JSON.stringify({username:u,password:p})});
    store.token=d.token; store.user=d.username;
    localStorage.setItem('sh.token',d.token); localStorage.setItem('sh.user',d.username);
    toast('注册成功'); route('/home');
  }catch(err){ e.textContent=err.message }
}

// ============ 同步 ============
let pushTimer;
function queuePush(){
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ pushProgress().catch(()=>{}) }, 2500);
}
async function pullProgress(){
  if(!store.token) return;
  try{
    const d=await api('/progress');
    const p=d.data||{};
    Object.assign(store.progress, p.progress||{});
    if(Array.isArray(p.wrongs)){
      const have=new Set(store.wrongs.map(w=>w.id));
      p.wrongs.forEach(w=>{ if(!have.has(w.id)) store.wrongs.push(w) });
    }
    save('sh.progress',store.progress); save('sh.wrongs',store.wrongs);
  }catch(e){}
}
async function pushProgress(){
  if(!store.token) return;
  await api('/progress',{method:'POST',body:JSON.stringify({
    progress: store.progress,
    wrongs: store.wrongs.map(w=>({id:w.id,lessonId:w.lessonId,lessonTitle:w.lessonTitle,cardId:w.cardId,preview:w.preview})),
    notes: {},
  })});
}

async function restoreAuth(){
  try{
    const r=await fetch(API+'/auth/config');
    const d=await r.json();
    store.registerOpen=!!d.registerOpen;
  }catch(e){}
  if(store.token){
    try{
      const d=await api('/auth/me');
      store.user=d.username;
      localStorage.setItem('sh.user',d.username);
      await pullProgress();
    }catch(e){
      store.token=''; store.user='';
      localStorage.removeItem('sh.token'); localStorage.removeItem('sh.user');
    }
  }
}
</script>
