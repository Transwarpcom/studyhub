# 学习台 · study.medwarp.com.cn
# 80 端口：ACME 验证 + 强制跳转 HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name study.medwarp.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
