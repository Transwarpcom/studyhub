# 学习台 · study.medwarp.com.cn
# 80：ACME 验证 + 跳 HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name study.medwarp.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443：反代到 StudyHub（127.0.0.1:8443）
# 证书来自 Let's Encrypt（acme.sh 签发），不是自签，iOS 无需信任 CA
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name study.medwarp.com.cn;

    ssl_certificate     /root/.acme.sh/study.medwarp.com.cn_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/study.medwarp.com.cn_ecc/study.medwarp.com.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:StudySSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64m;

    # ---- 登录墙：除登录/注册/公开内容外全部要求认证 ----
    # auth_request 交给 StudyHub 自己的 /auth/check 判定
    location = /auth/check {
        internal;
        proxy_pass https://127.0.0.1:8443/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_verify off;
    }

    # 反向代理公共参数
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    # 长轮询：保持足够长
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
    }
}
